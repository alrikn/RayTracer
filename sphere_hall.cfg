# =========================
# SPHERE HALL
# A long gallery corridor with pedestal-mounted spheres on both sides.
# Reflective walls + floor create deep inter-reflection depth.
# Pedestal formula: cylinder_top_y = -0.5+0.8 = 0.3; sphere_center_y = 0.3+0.4 = 0.7
# =========================

