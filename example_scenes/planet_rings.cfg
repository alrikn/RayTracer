# =========================
# PLANET RINGS
# Dramatic space scene: large planet with ring system, moon, and distant sun.
# No floor — pure black void. Low ambient for deep-space atmosphere.
# Light direction verified: -lightDir dot planet_camera_normal = 0.535 > 0 ✓
# =========================

scene = {
    width = 8000
    height = 4000
    brightness = 0.95
    max_depth = 4

    antialiasing = {
        technique = "supersampling";
        samples = 4;
    };
}

camera = {
    origin = [0.0, 3.0, 5.0]
    direction = [0.0, -0.2, -1.0]
    zoom = 0.85
}

shapes = (

    # ---- Sun: large yellow sphere far upper-left ----
    {
        type = "sphere"
        origin = [-14.0, 5.0, -20.0]
        radius = 4.0
        color = "yellow"
    },

    # ---- Planet: large cyan sphere, slightly reflective ----
    {
        type = "sphere"
        origin = [0.0, 0.0, -12.0]
        radius = 3.5
        color = "cyan"
        reflectivity = 0.1
    },

    # ---- Ring system: thin flat cylinder around planet equator ----
    # Radius 6.0 > planet radius 3.5, so ring extends beyond planet ✓
    {
        type = "cylinder"
        origin = [0.0, 0.2, -12.0]
        axis = [0.0, 1.0, 0.0]
        radius = 6.0
        height = 0.15
        color = "white"
        reflectivity = 0.2
    },

    # ---- Moon: small white sphere ----
    {
        type = "sphere"
        origin = [5.5, 2.0, -9.0]
        radius = 0.8
        color = "white"
        reflectivity = 0.05
    },

    # ---- Asteroid/rock: small red sphere ----
    {
        type = "sphere"
        origin = [-4.0, -1.5, -7.0]
        radius = 0.4
        color = "red"
    }
)

lights = (

    # Light traveling from sun direction toward scene center
    # direction = toward scene from sun at [-14,5,-20], scene center ~[0,0,-10]
    # Verified: dot(-lightDir, planet_camera_facing_normal) ≈ 0.535 > 0 ✓
    {
        type = "directional"
        direction = [0.7, -0.25, -0.5]
        brightness = 1.0
        color_vector = [255, 255, 255]
    },

    {
        type = "specular"
        direction = [0.7, -0.25, -0.5]
        brightness = 1.0
        shininess = 64.0
        specular_strength = 0.6
    },

    # Very low ambient — space is dark
    {
        type = "ambient"
        brightness = 0.08
        color_vector = [255, 255, 255]
    }
)
