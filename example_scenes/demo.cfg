# =========================
# DEMO SCENE — Showroom
# All shape types, rainbow palette, reflective floor
# =========================

scene = {
    width = 8000
    height = 4000
    brightness = 0.95
    max_depth = 5

    antialiasing = {
        technique = "supersampling";
        samples = 4;
    };
}

# =========================
# CAMERA
# =========================

camera = {
    origin = [0.0, 2.5, 4.0]
    direction = [0.0, -0.25, -1.0]
    zoom = 0.80
}

# =========================
# SHAPES
# =========================

shapes = (

    # ---- Floor ----
    {
        type = "plane"
        normal = [0, 1, 0]
        point = [0.0, -0.5, 0.0]
        color = "white"
        reflectivity = 0.3
        chessboard_pattern = true
    },

    # ---- Front-left: Blue sphere ----
    {
        type = "sphere"
        origin = [-3.5, 0.2, -3.5]
        radius = 0.75
        color = "blue"
        reflectivity = 0.25
    },

    # ---- Front-center: Red sphere (hero) ----
    {
        type = "sphere"
        origin = [0.0, 0.5, -3.0]
        radius = 1.0
        color = "red"
        reflectivity = 0.35
    },

    # ---- Front-right: Yellow cone (tip at top, base on floor) ----
    # apex at y = 2.0, base at y = -0.5 (floor)
    {
        type = "cone"
        origin = [3.5, 2.0, -3.5]
        axis = [0.0, -1.0, 0.0]
        radius = 0.8
        height = 2.5
        color = "yellow"
    },

    # ---- Mid-left: Cyan cylinder ----
    {
        type = "cylinder"
        origin = [-3.2, -0.5, -6.5]
        axis = [0.0, 1.0, 0.0]
        radius = 0.5
        height = 3.2
        color = "cyan"
        reflectivity = 0.12
    },

    # ---- Mid-center: Magenta cone (tall centerpiece) ----
    # apex at y = 3.2, base at y = -0.5 (floor)
    {
        type = "cone"
        origin = [0.0, 3.2, -7.0]
        axis = [0.0, -1.0, 0.0]
        radius = 1.1
        height = 3.7
        color = "magenta"
    },

    # ---- Mid-right: Green cylinder ----
    {
        type = "cylinder"
        origin = [3.2, -0.5, -6.5]
        axis = [0.0, 1.0, 0.0]
        radius = 0.5
        height = 2.7
        color = "green"
        reflectivity = 0.12
    },

    # ---- Far back: White pearl sphere (highly reflective) ----
    {
        type = "sphere"
        origin = [1.0, 1.5, -9.0]
        radius = 0.85
        color = "white"
        reflectivity = 0.55
    }
)

# =========================
# LIGHTS
# =========================

lights = (

    # Key light — upper-left, slightly in front
    {
        type = "directional"
        direction = [-0.6, -1.2, -0.3]
        brightness = 0.95
        color_vector = [255, 255, 255]
    },

    # Specular highlights — sharp and punchy
    {
        type = "specular"
        direction = [-0.6, -1.2, -0.3]
        brightness = 1.0
        shininess = 96.0
        specular_strength = 0.85
    },

    # Ambient fill — low, keeps shadows readable
    {
        type = "ambient"
        brightness = 0.30
        color_vector = [255, 255, 255]
    }
)
