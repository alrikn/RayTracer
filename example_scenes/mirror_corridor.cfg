# =========================
# INFINITE MIRROR CORRIDOR
# Two highly-reflective parallel walls. Reflections bounce 8 times.
# The floor is checkered — its pattern multiplies through every reflection.
# A floating red sphere acts as the focal point.
# =========================

scene = {
    width = 8000
    height = 4000
    brightness = 1.0
    max_depth = 8

    antialiasing = {
        technique = "supersampling";
        samples = 4;
    };
}

# =========================
# CAMERA
# Inside the corridor, very low, looking straight down the tunnel.
# Wide zoom (0.70) exaggerates the perspective convergence.
# =========================

camera = {
    origin = [0.0, 0.3, 2.0]
    direction = [0.0, -0.05, -1.0]
    zoom = 0.70
}

# =========================
# SHAPES
# =========================

shapes = (

    # ---- Left wall — faces inward (+x normal) ----
    {
        type = "plane"
        normal = [1.0, 0.0, 0.0]
        point = [-2.5, 0.0, -5.0]
        color = "white"
        reflectivity = 0.88
    },

    # ---- Right wall — faces inward (-x normal) ----
    {
        type = "plane"
        normal = [-1.0, 0.0, 0.0]
        point = [2.5, 0.0, -5.0]
        color = "white"
        reflectivity = 0.88
    },

    # ---- Checkered floor — reflects everything above it ----
    {
        type = "plane"
        normal = [0.0, 1.0, 0.0]
        point = [0.0, -1.0, 0.0]
        color = "white"
        reflectivity = 0.55
        chessboard_pattern = true
    },

    # ---- Central red sphere — the main focal point, floating ----
    {
        type = "sphere"
        origin = [0.0, 0.0, -5.0]
        radius = 0.65
        color = "red"
        reflectivity = 0.70
    },

    # ---- Cyan sphere — small, on the floor, deeper in ----
    # floor at y=-1, radius=0.4 → center y=-0.6
    {
        type = "sphere"
        origin = [-1.0, -0.6, -7.5]
        radius = 0.4
        color = "cyan"
        reflectivity = 0.45
    },

    # ---- Yellow sphere — small, on the floor, closer ----
    {
        type = "sphere"
        origin = [1.0, -0.7, -3.0]
        radius = 0.3
        color = "yellow"
        reflectivity = 0.45
    },

    # ---- Blue sphere — deep in the corridor ----
    {
        type = "sphere"
        origin = [0.0, -0.65, -10.0]
        radius = 0.35
        color = "blue"
        reflectivity = 0.40
    }
)

# =========================
# LIGHTS
# Light from above-right so one wall is slightly brighter than the other.
# High ambient keeps the deep reflections visible.
# =========================

lights = (

    # Slightly from the right so the right wall catches some diffuse light
    {
        type = "directional"
        direction = [0.3, -1.0, 0.1]
        brightness = 0.9
        color_vector = [255, 255, 255]
    },

    {
        type = "specular"
        direction = [0.3, -1.0, 0.1]
        brightness = 0.85
        shininess = 64.0
        specular_strength = 0.70
    },

    # High ambient — needed to see into the reflected depths
    {
        type = "ambient"
        brightness = 0.40
        color_vector = [255, 255, 255]
    }
)
