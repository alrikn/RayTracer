# =========================
# CORNELL BOX
# Classic 1984 benchmark — 5-plane closed room with geometric objects inside.
# High ambient simulates the color bleeding effect from the red/green walls.
# =========================

scene = {
    width = 8000
    height = 4000
    brightness = 0.95
    max_depth = 5

    antialiasing = {
        technique = "supersampling";
        samples = 4;
    };
}

camera = {
    origin = [0.0, 0.5, 3.5]
    direction = [0.0, -0.05, -1.0]
    zoom = 0.75
}

shapes = (

    # ---- Left wall: red, normal faces into box (+x) ----
    {
        type = "plane"
        normal = [1.0, 0.0, 0.0]
        point = [-3.0, 0.0, 0.0]
        color = "red"
        reflectivity = 0.0
    },

    # ---- Right wall: green, normal faces into box (-x) ----
    {
        type = "plane"
        normal = [-1.0, 0.0, 0.0]
        point = [3.0, 0.0, 0.0]
        color = "green"
        reflectivity = 0.0
    },

    # ---- Back wall: white, normal faces camera (+z) ----
    {
        type = "plane"
        normal = [0.0, 0.0, 1.0]
        point = [0.0, 0.0, -7.0]
        color = "white"
        reflectivity = 0.0
    },

    # ---- Floor: white chessboard, normal faces up (+y) ----
    {
        type = "plane"
        normal = [0.0, 1.0, 0.0]
        point = [0.0, -2.0, 0.0]
        color = "white"
        reflectivity = 0.2
        chessboard_pattern = true
    },

    # ---- Ceiling: white, normal faces down (-y) ----
    {
        type = "plane"
        normal = [0.0, -1.0, 0.0]
        point = [0.0, 3.0, 0.0]
        color = "white"
        reflectivity = 0.0
    },

    # ---- White sphere: matte, center_y = floor(-2) + radius(0.75) = -1.25 ----
    {
        type = "sphere"
        origin = [0.0, -1.25, -4.0]
        radius = 0.75
        color = "white"
        reflectivity = 0.05
    },

    # ---- Cyan cylinder: base on floor, top at y=0 ----
    {
        type = "cylinder"
        origin = [-1.0, -2.0, -5.0]
        axis = [0.0, 1.0, 0.0]
        radius = 0.4
        height = 2.0
        color = "cyan"
        reflectivity = 0.1
    },

    # ---- Yellow cone: apex at y=-0.5, base at floor y=-2 ----
    # base_y = origin_y - height = -0.5 - 1.5 = -2.0 = floor ✓
    {
        type = "cone"
        origin = [1.2, -0.5, -5.0]
        axis = [0.0, -1.0, 0.0]
        radius = 0.5
        height = 1.5
        color = "yellow"
    }
)

lights = (

    # From upper-right-front: illuminates left (red) wall, floor, front faces of objects
    {
        type = "directional"
        direction = [-0.5, -0.8, -0.3]
        brightness = 0.9
        color_vector = [255, 255, 255]
    },

    {
        type = "specular"
        direction = [-0.5, -0.8, -0.3]
        brightness = 0.9
        shininess = 64.0
        specular_strength = 0.6
    },

    # High ambient so the green wall (unlit side) is still clearly visible
    {
        type = "ambient"
        brightness = 0.45
        color_vector = [255, 255, 255]
    }
)
