# =========================
# PODIUM SCENE
# Three white pedestals — 1st place (center, tallest), 2nd (right), 3rd (left).
# Strong side lighting from the upper-left casts long dramatic shadows.
# Back wall catches the cylinder shadows. Checkered floor stretches away.
# Cylinder: origin = bottom center. Top = origin_y + height.
# Sphere: center_y = pedestal_top_y + sphere_radius
# =========================

scene = {
    width = 8000
    height = 4000
    brightness = 1.0
    max_depth = 5

    antialiasing = {
        technique = "supersampling";
        samples = 4;
    };
}

# =========================
# CAMERA
# Slightly elevated, looking slightly down. Captures all three pedestals.
# =========================

camera = {
    origin = [0.0, 2.5, 5.5]
    direction = [0.0, -0.12, -1.0]
    zoom = 0.82
}

# =========================
# SHAPES
# =========================

shapes = (

    # ---- Checkered floor ----
    {
        type = "plane"
        normal = [0, 1, 0]
        point = [0.0, -0.5, 0.0]
        color = "white"
        reflectivity = 0.30
        chessboard_pattern = true
    },

    # ---- Back wall — catches the long cylinder shadows ----
    # normal [0,0,1] faces the camera; lit by the directional light (z component = -0.3)
    {
        type = "plane"
        normal = [0.0, 0.0, 1.0]
        point = [0.0, 0.0, -9.5]
        color = "white"
        reflectivity = 0.02
    },

    # ============================
    # 3RD PLACE PEDESTAL — left, shortest
    # bottom y=-0.5, height=1.2, top y=0.7
    # ============================

    {
        type = "cylinder"
        origin = [-3.5, -0.5, -5.5]
        axis = [0.0, 1.0, 0.0]
        radius = 0.80
        height = 1.2
        color = "white"
        reflectivity = 0.05
    },

    # blue trophy sphere — center_y = 0.7 + 0.60 = 1.30
    {
        type = "sphere"
        origin = [-3.5, 1.30, -5.5]
        radius = 0.60
        color = "blue"
        reflectivity = 0.25
    },

    # ============================
    # 1ST PLACE PEDESTAL — center, tallest
    # bottom y=-0.5, height=3.5, top y=3.0
    # ============================

    {
        type = "cylinder"
        origin = [0.0, -0.5, -5.5]
        axis = [0.0, 1.0, 0.0]
        radius = 0.80
        height = 3.5
        color = "white"
        reflectivity = 0.05
    },

    # red trophy sphere — center_y = 3.0 + 0.90 = 3.90
    {
        type = "sphere"
        origin = [0.0, 3.90, -5.5]
        radius = 0.90
        color = "red"
        reflectivity = 0.40
    },

    # ============================
    # 2ND PLACE PEDESTAL — right, medium
    # bottom y=-0.5, height=2.2, top y=1.7
    # ============================

    {
        type = "cylinder"
        origin = [3.5, -0.5, -5.5]
        axis = [0.0, 1.0, 0.0]
        radius = 0.80
        height = 2.2
        color = "white"
        reflectivity = 0.05
    },

    # yellow trophy sphere — center_y = 1.7 + 0.72 = 2.42
    {
        type = "sphere"
        origin = [3.5, 2.42, -5.5]
        radius = 0.72
        color = "yellow"
        reflectivity = 0.30
    }
)

# =========================
# LIGHTS
# Strong side lighting from upper-left — maximum shadow drama.
# The tall center pedestal casts a long shadow across the floor and back wall.
# Low ambient keeps the shadow areas dark and punchy.
# =========================

lights = (

    # Key: upper-left, strong horizontal component
    {
        type = "directional"
        direction = [0.80, -0.80, -0.30]
        brightness = 1.1
        color_vector = [255, 255, 255]
    },

    {
        type = "specular"
        direction = [0.80, -0.80, -0.30]
        brightness = 0.95
        shininess = 96.0
        specular_strength = 0.75
    },

    # Low ambient — keep shadows dramatic
    {
        type = "ambient"
        brightness = 0.20
        color_vector = [255, 255, 255]
    }
)
